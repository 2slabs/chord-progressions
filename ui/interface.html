<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chord Progressions</title>
    <script>
      // Replaced by the extension with Live's current key, tempo and saved settings.
      window.__INIT__ = null;
    </script>
    <style>
      :root {
        --bg: #2e2e2e;
        --panel: #3a3a3a;
        --field: #1f1f1f;
        --border: #191919;
        --text: #e6e6e6;
        --muted: #9a9a9a;
        --accent: #ffa630;
        --accent-text: #1a1a1a;
        --playing: #5fb4ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 12px/1.3 -apple-system, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        padding: 14px 16px;
        gap: 10px;
        user-select: none;
        -webkit-user-select: none;
      }
      .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
      label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 11px; }
      select, .seg {
        background: var(--field);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 3px;
        font: inherit;
        height: 24px;
      }
      select { padding: 0 6px; min-width: 64px; }
      .seg { display: inline-flex; padding: 0; overflow: hidden; }
      .seg button {
        background: none; border: 0; color: var(--muted); font: inherit;
        padding: 0 9px; cursor: pointer; border-left: 1px solid var(--border);
      }
      .seg button:first-child { border-left: 0; }
      .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
      label.style select { min-width: 150px; font-weight: 600; }
      .divider { height: 1px; background: var(--border); margin: 0 -16px; }
      .hint { color: var(--muted); font-size: 11px; min-height: 14px; }
      .hint b { color: var(--text); font-weight: 600; }
      #cards { display: grid; gap: 6px; flex: 1; min-height: 0; }
      .card {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 4px; cursor: pointer; min-width: 0;
      }
      .card:hover { border-color: #555; }
      .card.playing { border-color: var(--playing); box-shadow: inset 0 0 0 1px var(--playing); }
      .card .numeral { font-size: 20px; font-weight: 600; white-space: nowrap; }
      .card .name { color: var(--muted); font-size: 12px; white-space: nowrap; }
      .card .reroll {
        position: absolute; top: 3px; right: 3px; width: 20px; height: 20px;
        background: none; border: 0; color: var(--muted); cursor: pointer; border-radius: 3px; font-size: 13px;
      }
      .card .reroll:hover { color: var(--text); background: #4a4a4a; }
      .actions { display: flex; gap: 8px; align-items: center; }
      .actions .spacer { flex: 1; }
      .btn {
        height: 26px; padding: 0 12px; border-radius: 3px; font: inherit; cursor: pointer;
        background: var(--panel); color: var(--text); border: 1px solid var(--border);
      }
      .btn:hover { background: #454545; }
      .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
      .btn.primary:hover { filter: brightness(1.08); }
      kbd { color: var(--muted); font-family: inherit; font-size: 10px; margin-left: 4px; }
      .btn.primary kbd { color: #5a3a00; }
    </style>
  </head>
  <body>
    <div class="row">
      <label class="style">Style <select id="style"></select></label>
      <label>Root <select id="root"></select></label>
      <label>Scale <select id="scale"></select></label>
      <label>Chords <select id="count"></select></label>
      <label>Each chord <select id="length">
        <option value="2">2 beats</option>
        <option value="4">1 bar</option>
        <option value="8">2 bars</option>
        <option value="16">4 bars</option>
      </select></label>
    </div>
    <div class="row">
      <label>Chord <select id="chord"></select></label>
      <label title="Diatonic builds each chord from the scale. Parallel moves one chord shape to each new root – the dub / Detroit stab sound.">Movement <span class="seg" id="movement">
        <button data-v="diatonic">Diatonic</button><button data-v="parallel">Parallel</button>
      </span></label>
      <label>Voicing <span class="seg" id="voicing">
        <button data-v="smooth" title="Inversions that move as little as possible">Smooth</button><button data-v="close" title="Root position, packed tight">Close</button><button data-v="spread" title="Open voicings">Spread</button>
      </span></label>
      <label>Register <span class="seg" id="register">
        <button data-v="48">Low</button><button data-v="60">Mid</button><button data-v="72">High</button>
      </span></label>
      <label>Bass <span class="seg" id="bass">
        <button data-v="true">On</button><button data-v="false">Off</button>
      </span></label>
    </div>
    <div class="row">
      <label>Rhythm <select id="rhythm"></select></label>
      <label title="Delays every second 16th">Swing <select id="swing">
        <option value="50">Off</option>
        <option value="54">54%</option>
        <option value="58">58%</option>
        <option value="62">62%</option>
      </select></label>
      <label title="Chord changes land a 16th early – the house anticipation">Push <span class="seg" id="push">
        <button data-v="false">Off</button><button data-v="true">On</button>
      </span></label>
    </div>
    <div class="divider"></div>
    <div class="hint" id="hint"></div>
    <div id="cards"></div>
    <div class="actions">
      <button class="btn" id="generate">Generate<kbd>G</kbd></button>
      <button class="btn" id="play">Preview<kbd>Space</kbd></button>
      <span class="spacer"></span>
      <button class="btn" id="cancel">Cancel<kbd>Esc</kbd></button>
      <button class="btn primary" id="insert">Insert Clip<kbd>↵</kbd></button>
    </div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
