<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>chord progressions</title>
    <script>
      // Replaced by the extension with Live's current key, tempo and saved settings.
      window.__INIT__ = null;
    </script>
    <!-- The 2sl-ui design system (synced into ./2sl by 2sl-ui/scripts/sync.sh; edit it there). -->
    <link rel="stylesheet" href="./2sl/tokens.css" />
    <link rel="stylesheet" href="./2sl/components.css" />
    <style>
      /* Layout for this dialog only. */
      html, body { height: 100%; }
      body {
        display: flex; flex-direction: column; gap: calc(var(--unit) * 3);
        padding: calc(var(--unit) * 4); user-select: none; -webkit-user-select: none;
      }
      .style-row { display: flex; align-items: center; gap: calc(var(--unit) * 2); }
      .swatch { width: 12px; height: 12px; border: 1px solid var(--ink); background: var(--hue); }
      #style { min-width: 180px; }
      #rhythm { min-width: 200px; }
      .swing { display: inline-flex; align-items: center; gap: calc(var(--unit) * 2); }
      .swing-value { min-width: 8ch; }
      .inline { display: inline-flex; align-items: center; gap: calc(var(--unit) * 2); }
      #cards { flex: 1; min-height: 0; }
      #source { min-width: 260px; }
      #target { min-width: 220px; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <header class="ui-header">
      <span class="ui-wordmark">chord progressions</span>
      <span class="ui-status" id="status"></span>
      <span class="spacer"></span>
      <span class="ui-status" id="tempo"></span>
      <span id="theme" title="dialog theme"></span>
    </header>

    <div class="style-row">
      <span class="swatch" aria-hidden="true"></span>
      <select id="style" aria-label="style"></select>
      <span class="ui-hint" id="blurb"></span>
    </div>

    <div class="ui-params">
      <span class="label" title="write chords for a bassline or melody clip, or start from nothing">follow</span>
      <span class="inline"><select id="source" aria-label="clip to follow"></select><span class="ui-hint" id="fit"></span></span>
    </div>

    <div class="ui-params">
      <span class="label">key</span>
      <span class="inline"><select id="root" aria-label="root"></select><select id="scale" aria-label="scale"></select></span>
      <span class="label">chords</span>
      <span class="inline"><select id="count" aria-label="number of chords"></select><span id="length"></span></span>

      <span class="label">chord</span>
      <select id="chord" aria-label="chord type"></select>
      <span class="label">voicing</span>
      <span id="voicing"></span>

      <span class="label">movement</span>
      <span id="movement" title="diatonic builds each chord from the scale. parallel moves one shape to each new root: the dub / detroit stab sound."></span>
      <span class="label">register</span>
      <span class="inline"><span id="register"></span><span class="ui-label">bass</span><button id="bass" aria-label="bass note"></button></span>
    </div>

    <div class="ui-rule"></div>

    <div class="ui-params">
      <span class="label">rhythm</span>
      <select id="rhythm" aria-label="rhythm"></select>
      <span class="label">swing</span>
      <span class="swing">
        <span id="swing"><input aria-label="swing" /></span>
        <span class="swing-value" id="swing-value"></span>
        <span id="swing-presets"></span>
      </span>

      <span class="label" title="chord changes land a 16th early: the house anticipation">push</span>
      <span><button id="push" aria-label="push chord changes a 16th early"></button></span>
    </div>
    <div class="ui-steps" id="steps" title="click a step: rest → hit → accent"></div>

    <div class="ui-pads" id="cards"></div>

    <div class="ui-params" id="into-row">
      <span class="label">into</span>
      <span class="inline"><select id="target" aria-label="track for the chord clip"></select><span class="ui-hint" id="where"></span></span>
    </div>

    <footer class="ui-footer">
      <button class="ui-key" id="generate"><kbd>g</kbd>generate</button>
      <button class="ui-key" id="play"><kbd>space</kbd><span>preview</span></button>
      <span class="inline"><span class="ui-label">with clip</span><button id="hear-source" aria-label="hear the followed clip in the preview"></button></span>
      <span class="spacer"></span>
      <button class="ui-key" id="cancel"><kbd>esc</kbd>cancel</button>
      <button class="ui-key primary" id="insert"><kbd>ret</kbd>insert clip</button>
    </footer>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
